services:
  mysql:
    image: mysql:8.4
    container_name: conecta-acesso-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: conecta_acesso
      MYSQL_USER: conecta
      MYSQL_PASSWORD: conecta123
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: